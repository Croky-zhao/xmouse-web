<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐私政策 - XMouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { DEFAULT: '#7146ED', dark: '#5A33C2' } } } },
        };
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
        .prose h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1.5rem; }
        .prose h2 { font-size: 1.5rem; font-weight: 600; margin-top: 2.5rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; }
        .prose h3 { font-size: 1.125rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #374151; }
        .prose p { margin-bottom: 1rem; line-height: 1.75; color: #4b5563; }
        .prose ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #4b5563; line-height: 1.75; }
        .prose ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #4b5563; line-height: 1.75; }
        .prose li { margin-bottom: 0.25rem; }
        .prose strong { color: #111827; font-weight: 600; }
        .prose a { color: #7146ED; text-decoration: underline; }
        .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.95rem; }
        .prose th { background: #f9fafb; border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; font-weight: 600; }
        .prose td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; vertical-align: top; }
        .prose hr { margin: 2rem 0; border: 0; border-top: 1px solid #e5e7eb; }
        .prose em { color: #6b7280; }
        .prose blockquote { border-left: 4px solid #7146ED; padding-left: 1rem; color: #6b7280; font-style: italic; margin: 1rem 0; }
    </style>
</head>
<body class="bg-white text-gray-900">

    <!-- 导航 -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-gray-100">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="./index.html" class="flex items-center gap-2">
                <span class="text-2xl">🖱️</span>
                <span class="text-xl font-semibold">XMouse</span>
            </a>
            <a href="./index.html" class="text-sm text-gray-600 hover:text-gray-900">← 返回首页</a>
        </div>
    </nav>

    <!-- 内容 -->
    <main class="max-w-3xl mx-auto px-6 py-12">
        <div id="content" class="prose">加载中...</div>
    </main>

    <!-- 底部 -->
    <footer class="bg-gray-900 text-gray-400 py-8 mt-16">
        <div class="max-w-3xl mx-auto px-6 text-center text-sm">
            <p>© 2026 芝芝信息技术工作室 ·
                <a href="./terms.html" class="hover:text-white">用户协议</a> ·
                <a href="mailto:sx.zhao.work@gmail.com" class="hover:text-white">联系我们</a>
            </p>
        </div>
    </footer>

    <script>
        fetch('./PRIVACY_POLICY.md')
            .then(r => r.text())
            .then(md => {
                document.getElementById('content').innerHTML = marked.parse(md);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<p style="color:red">隐私政策加载失败：' + err.message + '</p>';
            });
    </script>

</body>
</html>
